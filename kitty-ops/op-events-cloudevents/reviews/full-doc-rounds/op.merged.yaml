    '
- id: OP-ARCH-010
  lens: internal-consistency
  severity: 2
  title: ADR wording mentions maintainer approval of the direction and a 'confirmed on its PR' gate
  evidence:
  - artifact: "ADR front matter and Deciders line ('maintainer approval, 2026-10-13 (to be confirmed on\
      \ the PR)'); ADR Context ('direction approved 2026-10-13'); design \xA7 14 Phase 0 ('ADR confirmed\
      \ on its PR')"
  claim: 'These lines describe a gating step that is out of scope for the brief, and the
    Phase 0 exit criterion makes the ADR''s status a gate on the phased rollout.

    '
