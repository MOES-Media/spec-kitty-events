schema: review-merged/v1
phase: op
mission: op-events-cloudevents
findings:
- id: OP-ARCH-001
  lens: compatibility-stability-contract
  severity: 5
  title: Fail-closed upcaster on the local read path would remove the permissive local-CLI reader the
    versioning contract guarantees
  evidence:
  - artifact: "design \xA7 9 (Failure behaviour: fail closed, never dropped, never defaulted), \xA7 11\
      \ (file is read by upcasting each line), \xA7 13 (local-CLI domain 'unchanged in kind'), ADR Consequences/Compatibility"
  - code: contracts/versioning-and-compatibility.md:78-93 (local-CLI reader permissive, 'Not weakened
      by any package bump'); COMPATIBILITY.md:762-768 (tolerates feature_slug, mission_key, rows missing
      schema_version, pre-canonical lanes)
  - code: src/spec_kitty_events/diary.py:1844 (reducer sorts raw `at` strings; no RFC 3339 parse), diary.py:486
      (empty-string mission_slug fallback), diary.py:1757-1789 (parse_diary accepts any event_id string
      on lane rows)
  claim: 'Today a lane row with a non-RFC-3339 or naive `at`, a non-ULID/UUID `event_id`, or no resolvable
    mission_id is still reduced. The design makes the same rows raise UPCAST_TIME_INVALID, UPCAST_ID_INVALID
    or UPCAST_MISSION_ID_UNRESOLVED on every read, including the local CLI reading a user''s own history,
    and the shape C rows fail closed outright. That narrows the local-CLI validity domain, which the contract
    forbids, while the design asserts the domain is unchanged. The ingress (fail-closed) and local (permissive)
    domains need different upcaster behaviours and the design defines only the strict one.

    '
  remediation: "Define two explicit upcaster modes, strict (ingress, merge driver writes) and local-read\
    \ (permissive: a row that the reducer accepts today still yields a result, or is passed through unchanged\
    \ with a named, non-fatal diagnostic), and state which callers use which. Add fixtures proving every\
    \ row the current reducer accepts is still accepted on the local path. Reword \xA7 13 so it does not\
    \ claim 'unchanged in kind' until this holds.\n"
- id: OP-ARCH-002
  lens: upcaster-completeness
  severity: 4
  title: The diary replay corpus contains rows the upcaster cannot and must not map, contradicting 'never
    drops a row' and 'every line' fixture coverage
  evidence:
  - artifact: "design \xA7 4 (last paragraph: non-lane rows 'map through the registry like shape A'; 'upcaster\
      \ itself never drops a row'), \xA7 9 Fixtures ('status_diary/replay/*.jsonl (shape B; every line)')"
  - code: src/spec_kitty_events/conformance/fixtures/status_diary/replay/status_diary_unknown_kinds.jsonl:1-3
      (rows with event_id 'dp-opened-1', 'future-1', 'retro-req-1', event_type 'SomeFutureProtocolEventV99',
      no `at`, no aggregate, no lamport)
  - code: 'src/spec_kitty_events/diary.py:1724-1749 (_is_non_lane_row: event_type presence, event_name
      retrospective.*, and `type`-keyed retrospective lifecycle events are ignored in place)'
  claim: 'Decision Point and retrospective rows written into status.events.jsonl are not shape A (they
    lack aggregate_id, build_id, node_id, lamport_clock, project_uuid, correlation_id) and use non-ULID
    ids and no timestamp. The upcaster as specified fails them with UPCAST_ID_INVALID, UPCAST_TIME_INVALID
    or UPCAST_UNMAPPED_EVENT_TYPE, so the ''every line'' fixture and the reducer-equivalence test cannot
    pass, and the reducer''s tolerated ignore-in-place rule is lost. Retrospective lifecycle events also
    use a `type` key, which collides with the shape C pre-3.0 `type`/`ts`/`wp` detection and would be
    misclassified as UPCAST_UNRECOGNISED_SHAPE. Annotation rows (`kind: annotation`, `delta`, InnerStateChanged)
    have no mapping table at all.

    '
  remediation: 'Add a shape D section covering Decision Point rows, retrospective rows (both `event_name`
    and `type` forms) and annotation rows with explicit mapping or an explicit ''pass-through, not upcast''
    outcome and its own error semantics; make shape detection order explicit so retrospective `type` rows
    are not read as pre-3.0 shape C; give annotation fields (kind, delta) mapping rows; restate the fixture
    claim as ''every row of the corpus has an expected CloudEvent, pass-through or error code''.

    '
- id: OP-ARCH-003
  lens: payload-compatibility
  severity: 4
  title: '''Existing payload models carry over'' is false for WPStatusChanged, and the merged lane.transitioned.v1
    data shape is not defined'
  evidence:
  - artifact: "ADR Decision Drivers ('existing payload models and fixtures should carry over'); design\
      \ \xA7 1 ('A and B converge on one CloudEvent type'), \xA7 3 'Lifted payload fields', \xA7 4 table"
  - code: 'src/spec_kitty_events/status.py:411-466 (StatusTransitionPayload: extra=''forbid''; requires
      mission_slug, wp_id, actor, execution_mode; from_lane Optional; has mission_id and summary; no policy_metadata,
      no review_result)'
  - code: 'src/spec_kitty_events/diary.py:414-445 (StatusEvent: from_lane required, has policy_metadata,
      review_result)'
  claim: 'Lifting mission_slug, wp_id, actor and execution_mode out of `data` means the post-lift `data`
    cannot validate against StatusTransitionPayload (required fields removed, extra=forbid), so a new
    payload model and schema are needed. The one merged type must also reconcile shape A fields absent
    from the design (`summary`, optional `mission_id`, `from_lane: null`) with shape B-only fields (`policy_metadata`,
    `review_result`), and states no rule for a payload.mission_id that disagrees with the aggregate-derived
    missionid (UPCAST_CONFLICTING_FIELDS lists only four lifted fields). The ADR rule ''a field with no
    mapping is a defect'' is therefore violated by the design''s own tables.

    '
  remediation: 'Add a normative `data` schema for lane.transitioned.v1 as a union with optionality stated,
    map `summary`, `mission_id` and `from_lane: null` explicitly, extend UPCAST_CONFLICTING_FIELDS to
    payload.mission_id, and drop or qualify the ''payload models carry over'' driver. State whether the
    post-lift model is a new Pydantic model (charter: Pydantic remains the source) and how WPStatusChanged''s
    old model stays for legacy validation.

    '
- id: OP-ARCH-004
  lens: versioning-rule
  severity: 4
  title: Cutover release and the 3.0.0 accept boundary are undefined; design cites a 'cutover release
    (section 14)' that section 14 does not contain
  evidence:
  - artifact: "design \xA7 8 last paragraph ('until the cutover release (section 14)'), \xA7 14 Phase\
      \ 3 and Phase 5; ADR Consequences/Versioning and Open question 3; ADR Compatibility ('explicit cutover\
      \ decision')"
  - code: src/spec_kitty_events/strict.py:144, 626-636 (validate_strict_envelope requires schema_version
      == '3.0.0'); contracts/versioning-and-compatibility.md:18-25 (producers must keep emitting 3.0.0;
      strict profile rejects anything else)
  claim: 'The documents never say when validate_strict_envelope stops accepting 3.0.0 `Event`, nor whether
    SaaS ingress keeps accepting shape A after Phase 4. Phase 3 adds a validator alongside and calls the
    release ''the new major'', yet a purely additive validator does not change the 3.0.0 boundary, so
    ''on-wire 3.0.0 to 4.0.0'' is claimed without a release that makes it true. Until fixed, producers
    following the contract (must emit 3.0.0) and the design (emit CloudEvents) conflict, and the charter''s
    ''explicit cutover decision'' for canonical-field changes is not satisfiable because the timing question
    (Q3) is open while the ADR says it ''is the explicit cutover decision''.

    '
  remediation: 'Define a cutover phase row: which release makes shape A rejected by the strict profile
    (or states shape A remains accepted at ingress indefinitely), which release flips the contract text
    ''producers must emit 3.0.0'', and which release is the major. Make the ADR sentence conditional:
    the explicit cutover decision is recorded when Q3 is ruled. Fix the dangling ''section 14'' reference.

    '
- id: OP-ARCH-005
  lens: upcaster-determinism-idempotence
  severity: 3
  title: 'Merge driver behaviour is under-specified: dedupe by id alone conflicts with the reducer''s
    same-id seed rule, and ''no log rewrite'' versus emitting upcast rows is not resolved'
  evidence:
  - artifact: "ADR Compatibility ('merge driver uses the upcaster ... merges by id'); design \xA7 6 ('merge\
      \ driver dedupes by id alone'), \xA7 15 Id collapse, \xA7 14 Phase 5"
  - code: 'src/spec_kitty_events/diary.py:1805-1806, 1615 (dedupe: first occurrence; all-seed same-id
      rows keep the canonical-minimum row, content-based)'
  - code: src/spec_kitty_events/models.py:27-56 (normalize_event_id lowercases UUIDs, uppercases ULIDs,
      so spelling variants collide after upcast but not in the reducer's raw-string dedupe)
  claim: 'Three gaps. (1) The driver''s output form is not stated: if it writes upcast rows into the merged
    file the log is rewritten for merged rows, contradicting ''no log rewrite''; if it keeps original
    bytes it must still key dedupe on the upcast id. (2) ''Dedupes by id alone'' ignores that same-id
    migration seeds with different content resolve by canonical-minimum row, so a naive driver changes
    reduction results. (3) id normalisation merges spelling variants that the reducer treats as distinct,
    so the reducer-equivalence test can fail on logs with such duplicates. The ''as it does today for
    diary rows'' claim concerns the spec-kitty merge driver, which is not in this repo and is unverified
    here.

    '
  remediation: 'Specify that the driver compares by upcast id but writes the original bytes of the retained
    row, reuse the reducer''s same-id resolution rule (cite diary.py), add a fixture with a spelling-variant
    duplicate and a same-id differing seed pair, and mark the current-driver behaviour as unverified or
    cite the spec-kitty file and line.

    '
- id: OP-ARCH-006
  lens: upcaster-determinism-idempotence
  severity: 3
  title: 'Determinism statement inconsistencies: ''never defaulted'' versus data_tier default, source
    depends on caller context, idempotence not stated as a property'
  evidence:
  - artifact: "design \xA7 9 (Determinism, Failure behaviour 'never defaulted'), \xA7 3 (data_tier 'copied';\
      \ shape A trace says 'data_tier (default 0)'), \xA7 4 (missionid from caller context), \xA7 6 (source+id\
      \ uniqueness)"
  - code: src/spec_kitty_events/models.py:141-146 (schema_version and data_tier have defaults; strict.py:97-98
      lists them required in the strict profile)
  claim: 'The upcaster defaults data_tier for shape A rows that omit it while claiming never to default.
    `source` embeds missionid, which for shape B comes from caller context (meta.json); the same row upcast
    under two contexts yields different `source` and therefore different identity under the spec''s source+id
    rule, and a context mission_id that disagrees with a row''s own mission_id is not covered by any error
    code. Idempotence (upcast of an upcast CloudEvent) is stated only as ''validated and returned unchanged'',
    with no property test listed.

    '
  remediation: 'Say which defaults are applied (list them in the mapping tables) or require the field
    and fail closed; add UPCAST_CONFLICTING_FIELDS coverage for row-versus-context mission_id; add a hypothesis
    property test list: determinism, idempotence (upcast(upcast(x)) == upcast(x)), and context-independence
    of `id`.

    '
- id: OP-ARCH-007
  lens: contract-soundness
  severity: 3
  title: Ordering and reducer integration are out of scope in the design yet required by the exit criteria
  evidence:
  - artifact: "design \xA7 1 (out of scope: reducer's folding rules), \xA7 9 (reducer-equivalence test),\
      \ \xA7 5; ADR Open question 1"
  - code: src/spec_kitty_events/diary.py:1757-1789 (parse_diary decodes legacy dicts only), diary.py:1844
      (sort key (at, event_id))
  claim: 'The reducer-equivalence test requires the diary reducer to consume the upcast form, but parse_diary
    and StatusEvent.from_dict decode only the legacy keys. Nothing says whether diary.reduce gains a CloudEvent
    input path, whether upcasting happens before parse_diary, or whether the reducer sort key changes
    with Q1. The reducer-equivalence phase 2 exit therefore has no defined mechanism, and the choice interacts
    with Q1 (option B/C changes the sort key).

    '
  remediation: 'Add a section stating the integration seam (for example upcast rows are mapped back through
    a CloudEvent-to-StatusEvent decoder, or parse_diary accepts CloudEvents) and make the Q1 options say
    what happens to diary.reduce sorting for each option.

    '
- id: OP-ARCH-008
  lens: consumer-impact
  severity: 3
  title: Consumer impact claims omit the SaaS ingress decision for shape A and the central contract content
  evidence:
  - artifact: ADR Consequences/Consumers (spec-kitty-saas, Read API)
  - code: ../spec-kitty-saas/contracts/cli-saas-current-api.yaml (charter 'Central CLI-SaaS API Contract';
      not read, sibling repo)
  claim: 'The ADR says saas ''must accept the new envelope and keep rejecting raw historical rows'' but
    not whether it keeps accepting shape A 3.0.0 rows during the transition, which is the live CLI-to-SaaS
    shape today. The claim that the central contract needs updating is correct per the charter, but its
    concrete deltas (which endpoints, which accepted envelope versions) are not listed, and the Read API
    ''reads the diary through the shared reader'' is described as a Java reimplementation without saying
    which strict/local mode (see OP-ARCH-001) it uses. These are consumer claims not verifiable from this
    repo.

    '
  remediation: 'List the concrete contract deltas as a table (consumer, accepts, emits, mode) per phase,
    mark sibling-repo claims as unverified until read, and tie the Read API to the permissive local-read
    mode.

    '
- id: OP-ARCH-009
  lens: internal-consistency
  severity: 2
  title: 'Version-axis wording: schemaversion extension duplicates specversion/dataschema and the ''package
    pins <11'' claim is unsourced'
  evidence:
  - artifact: "design \xA7 8 table; ADR Versioning ('consumers pin <11')"
  - code: COMPATIBILITY.md:3 (package 10.4.4)
  claim: 'Four version axes are listed but the need for a separate `schemaversion` attribute (versus the
    type `.vN` suffix and dataschema) is not argued; the ''<11'' consumer pin is asserted without a citation.
